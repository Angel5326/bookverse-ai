{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">
    <h2>All Books</h2>
    <div class="row">
        {% for book in books %}
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                {% if book.image %}
                <img src="{{ book.image.url }}" class="card-img-top" alt="{{ book.title }}">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ book.title }}</h5>
                    <p class="card-text text-muted">{{ book.author.name|default:"Unknown Author" }}</p>
                    <p class="card-text"><strong>₹{{ book.price }}</strong></p>
                    <a href="{% url 'store:book_detail' book.slug %}" class="btn btn-primary">View Details</a>
                </div>
            </div>
        </div>
        {% empty %}
        <p>No books available yet.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
