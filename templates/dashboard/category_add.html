{% extends 'dashboard/base_dashboard.html' %}
{% load static %}

{% block dashboard_content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-6">
    <div class="bv-dash-card">
      <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom border-secondary-subtle">
        <div>
          <h2 class="bv-dash-section-title mb-1">
            <i class="bi bi-tag-fill text-info me-2"></i>Add Category
          </h2>
          <p class="text-muted small mb-0">Create a new genre or classification shelf.</p>
        </div>
        <a href="{% url 'dashboard:category_list' %}" class="btn-bv-pill-outline btn-sm">
          <i class="bi bi-arrow-left me-1"></i> Back
        </a>
      </div>

      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label for="id_cat_name" class="form-label text-white fw-medium">Category Name <span class="text-danger">*</span></label>
          <input type="text" name="name" id="id_cat_name" class="form-control bv-dash-input" placeholder="e.g. Science Fiction" required>
        </div>

        <div class="mb-4">
          <label for="id_cat_desc" class="form-label text-white fw-medium">Description</label>
          <textarea name="description" id="id_cat_desc" rows="4" class="form-control bv-dash-input" placeholder="Short description of this genre or theme..."></textarea>
        </div>

        <div class="d-flex align-items-center justify-content-end gap-2">
          <a href="{% url 'dashboard:category_list' %}" class="btn-bv-pill-outline">Cancel</a>
          <button type="submit" class="btn-bv-pill-blue">
            <i class="bi bi-check-lg me-1"></i> Create Category
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
