{% extends 'dashboard/base_dashboard.html' %}
{% load static %}

{% block dashboard_content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <div class="bv-dash-card">
      <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom border-secondary-subtle">
        <div>
          <h2 class="bv-dash-section-title mb-1">
            <i class="bi bi-plus-circle-fill text-primary me-2"></i>Add New Book
          </h2>
          <p class="text-muted small mb-0">Fill in the details below to add a new book to the BookVerse AI inventory.</p>
        </div>
        <a href="{% url 'dashboard:book_list' %}" class="btn-bv-pill-outline btn-sm">
          <i class="bi bi-arrow-left me-1"></i> Back to Catalog
        </a>
      </div>

      <form method="post" class="needs-validation">
        {% csrf_token %}

        <div class="mb-3">
          <label for="id_title" class="form-label text-white fw-medium">Book Title <span class="text-danger">*</span></label>
          <input type="text" name="title" id="id_title" class="form-control bv-dash-input" placeholder="e.g. The Psychology of Money" required>
        </div>

        <div class="mb-3">
          <label for="id_price" class="form-label text-white fw-medium">Price (INR ₹) <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-dark border-secondary text-white">₹</span>
            <input type="number" step="0.01" name="price" id="id_price" class="form-control bv-dash-input" placeholder="399.00" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="id_description" class="form-label text-white fw-medium">Description</label>
          <textarea name="description" id="id_description" rows="5" class="form-control bv-dash-input" placeholder="Enter book overview, synopsis, or key takeaways..."></textarea>
        </div>

        <div class="p-3 rounded-3 mb-4 bv-dash-toolbar">
          <label class="form-label text-white fw-medium d-block mb-2">Display Badges</label>
          <div class="d-flex gap-4 flex-wrap">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="id_best_seller" name="is_best_seller">
              <label class="form-check-label text-white" for="id_best_seller">
                <i class="bi bi-fire text-warning me-1"></i> Best Seller Badge
              </label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" role="switch" id="id_new_arrival" name="is_new_arrival" checked>
              <label class="form-check-label text-white" for="id_new_arrival">
                <i class="bi bi-sparkles text-info me-1"></i> New Arrival Badge
              </label>
            </div>
          </div>
        </div>

        <div class="d-flex align-items-center justify-content-end gap-2">
          <a href="{% url 'dashboard:book_list' %}" class="btn-bv-pill-outline">Cancel</a>
          <button type="submit" class="btn-bv-pill-blue">
            <i class="bi bi-check-lg me-1"></i> Save & Publish Book
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
