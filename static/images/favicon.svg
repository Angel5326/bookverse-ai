<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background 3D Blue Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3aa0ff" />
      <stop offset="50%" stop-color="#087cf8" />
      <stop offset="100%" stop-color="#0056c6" />
    </linearGradient>

    <!-- Glossy Glass Reflection -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#002b66" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base 3D Glossy App Tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Top Gloss Highlight -->
  <path d="M 4 18 C 4 9.16 11.16 2 20 2 L 44 2 C 52.84 2 60 9.16 60 18 L 60 27 C 60 28 59 29 58 29 L 6 29 C 5 29 4 28 4 27 Z" fill="url(#glossGrad)" />

  <!-- Inner Top Rim Inset Highlight -->
  <path d="M 18 3.5 L 46 3.5" stroke="rgba(255,255,255,0.8)" stroke-width="1" stroke-linecap="round" />

  <!-- Book Icon (bi-book-half) Centered -->
  <g transform="translate(14, 14) scale(2.25)" filter="url(#iconShadow)">
    <path fill="#ffffff" d="M8.5 2.687c.654-.689 1.782-.886 3.112-.752 1.234.124 2.503.523 3.388.893v9.923c-.918-.35-2.107-.692-3.287-.81-1.094-.111-2.278-.039-3.213.492zM8 1.783C7.015.936 5.587.81 4.287.94c-1.514.153-3.042.672-3.994 1.105A.5.5 0 0 0 0 2.5v11a.5.5 0 0 0 .707.455c.882-.4 2.303-.881 3.68-1.02 1.409-.142 2.59.087 3.223.877a.5.5 0 0 0 .78 0c.633-.79 1.814-1.019 3.222-.877 1.378.139 2.8.62 3.681 1.02A.5.5 0 0 0 16 13.5v-11a.5.5 0 0 0-.293-.455c-.952-.433-2.48-.952-3.994-1.105C10.413.809 8.985.936 8 1.783M1.783 12.556a10.5 10.5 0 0 1 2.862-.448c1.35 0 2.812.28 3.855.83V3.11c-.733-.51-1.85-.747-3.11-.861-1.065-.096-2.289.062-3.607.75v9.557z"/>
  </g>
</svg>
